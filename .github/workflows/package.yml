name: Package

# Building .deb / .rpm / container images is expensive (~15-25 min each,
# see "Building packages" in README.md), so this workflow only runs on tag
# pushes or manual dispatch — never on every push.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-deb
        run: cargo install cargo-deb
      # cargo deb builds the release binary itself; --no-build would need an
      # existing target/release binary, which this job does not have.
      - name: Build .deb
        run: cargo deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kloc-deb
          path: target/debian/*.deb

  rpm:
    # fedora:latest is not a GitHub-hosted runner; run the job inside a
    # Fedora container on a standard ubuntu runner instead.
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # fedora:latest has no git; install build deps before checkout.
      - name: Install build dependencies
        run: dnf install -y git jq rust cargo rpm-build gcc-c++ python3-devel
      - uses: actions/checkout@v4
      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/kloc-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version').tar.gz \
            --exclude .git --transform "s/^/kloc-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')/" .
          cp kloc.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/kloc.spec
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kloc-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners have docker but not podman; install it.
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build container image
        run: podman build --storage-driver=vfs -f Containerfile -t kloc:latest .
      - name: Test container
        run: podman run --rm --storage-driver=vfs -v .:/src:ro kloc:latest /src
      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          podman tag kloc:latest ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
          podman tag kloc:latest ghcr.io/${{ github.repository }}:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman push ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}
          podman push ghcr.io/${{ github.repository }}:latest
