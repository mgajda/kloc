[package]
name = "kloc"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Michal J. Gajda <mjgajda@migamake.com>"]
description = "Count lines of code and code complexity via universal AST parsing"
repository = "https://github.com/mgajda/kloc"
readme = "README.md"

[features]
default = ["all-programming-languages", "tokens"]
tokens = ["dep:gigatoken", "dep:unicode-normalization", "dep:base64"]

# All languages
all-languages = [
    "all-programming-languages",
    "all-machine-languages",
]

# Programming language subgroups
all-programming-query-languages = ["sequel"]

# Machine language subgroups (only compatible crates)
all-configuration-languages = ["cmake", "hcl"]
all-markup-languages = ["html", "rst", "asciidoc"]
all-data-languages = ["json", "yaml", "proto"]
all-shader-languages = ["glsl"]
all-machine-other-languages = ["css", "graphql", "make", "v"]

# Individually gated: toml, markdown, wgsl, vue, prisma, hare, tlaplus
# (these pull in old tree-sitter C lib; enable explicitly if needed)

# Programming languages
all-programming-languages = [
    "ada", "agda", "bash", "c", "cpp", "csharp", "dart",
    "elixir", "elm", "erlang", "fish", "fortran",
    "fsharp", "gleam", "go", "groovy",
    "haskell", "java", "javascript", "julia",
    "lua", "nix", "ocaml", "odin", "pascal",
    "perl", "php", "powershell", "python", "r",
    "ruby", "rust", "scala", "scheme", "slint",
    "solidity", "swift", "typescript", "verilog",
    "vhdl", "zig", "zsh",
    "asm", "commonlisp", "dafny", "elisp",
    "nickel", "sas",
    "all-programming-query-languages",
]

# Individually gated (pull in old tree-sitter C lib): hare, prisma, vue, wgsl

# Machine/data languages
all-machine-languages = [
    "all-configuration-languages",
    "all-markup-languages",
    "all-data-languages",
    "all-shader-languages",
    "all-machine-other-languages",
]

ada = ["tree-sitter-ada"]
agda = ["tree-sitter-agda"]
bash = ["tree-sitter-bash"]
c = ["tree-sitter-c"]
cpp = ["tree-sitter-cpp"]
csharp = ["tree-sitter-c-sharp"]
css = ["tree-sitter-css"]
dart = ["tree-sitter-dart"]
elixir = ["tree-sitter-elixir"]
elm = ["tree-sitter-elm"]
erlang = ["tree-sitter-erlang"]
fish = ["tree-sitter-fish"]
fortran = ["tree-sitter-fortran"]
fsharp = ["tree-sitter-fsharp"]
gleam = ["tree-sitter-gleam"]
glsl = ["tree-sitter-glsl"]
go = ["tree-sitter-go"]
graphql = ["tree-sitter-graphql"]
groovy = ["tree-sitter-groovy"]
haskell = ["tree-sitter-haskell"]
hcl = ["tree-sitter-hcl"]
html = ["tree-sitter-html"]
java = ["tree-sitter-java"]
javascript = ["tree-sitter-javascript"]
json = ["tree-sitter-json"]
julia = ["tree-sitter-julia"]
lua = ["tree-sitter-lua"]
make = ["tree-sitter-make"]
nix = ["tree-sitter-nix"]
ocaml = ["tree-sitter-ocaml", "tree-sitter-ocamllex"]
odin = ["tree-sitter-odin"]
pascal = ["tree-sitter-pascal"]
perl = ["tree-sitter-perl"]
asm = ["tree-sitter-asm"]
commonlisp = ["tree-sitter-commonlisp"]
cmake = ["tree-sitter-cmake"]
dafny = ["tree-sitter-dafny"]
elisp = ["tree-sitter-elisp"]
hare = ["tree-sitter-hare"]
markdown = ["tree-sitter-markdown"]
nickel = ["tree-sitter-nickel"]
prisma = ["tree-sitter-prisma"]
rst = ["tree-sitter-rst"]
sas = ["tree-sitter-sas"]
sequel = ["tree-sitter-sequel"]

toml = ["tree-sitter-toml"]
vue = ["tree-sitter-vue"]
wgsl = ["tree-sitter-wgsl"]
asciidoc = ["tree-sitter-asciidoc"]
php = ["tree-sitter-php"]
powershell = ["tree-sitter-powershell"]
proto = ["tree-sitter-proto"]
python = ["tree-sitter-python"]
r = ["tree-sitter-r"]
ruby = ["tree-sitter-ruby"]
rust = ["tree-sitter-rust"]
scala = ["tree-sitter-scala"]
scheme = ["tree-sitter-scheme"]
slint = ["tree-sitter-slint"]
solidity = ["tree-sitter-solidity"]
swift = ["tree-sitter-swift"]
typescript = ["tree-sitter-typescript"]
v = ["tree-sitter-v"]
verilog = ["tree-sitter-verilog"]
vhdl = ["tree-sitter-vhdl"]
yaml = ["tree-sitter-yaml"]
zig = ["tree-sitter-zig"]
zsh = ["tree-sitter-zsh"]


[dependencies]
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
unicode-normalization = { version = "0.1", optional = true }
walkdir = "2"
gigatoken = { git = "https://github.com/mgajda/gigatoken.git", optional = true }

tree-sitter-ada = { version = "0.1", optional = true }
tree-sitter-agda = { version = "1", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-elm = { version = "5", optional = true }
tree-sitter-erlang = { version = "0.20", optional = true }
tree-sitter-fish = { version = "3", optional = true }
tree-sitter-fortran = { version = "0.6", optional = true }
tree-sitter-fsharp = { version = "0.3", optional = true }
tree-sitter-gleam = { version = "1", optional = true }
tree-sitter-glsl = { version = "0.2", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-graphql = { version = "0.1", optional = true }
tree-sitter-groovy = { version = "0.1", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-hcl = { version = "1", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-make = { version = "1", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-ocaml = { version = "0.25", optional = true }
tree-sitter-ocamllex = { version = "0.25", optional = true }
tree-sitter-odin = { version = "1", optional = true }
tree-sitter-pascal = { version = "0.10", optional = true }
tree-sitter-perl = { version = "1", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-proto = { version = "0.4", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-r = { version = "1", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-scheme = { version = "0.24", optional = true }
tree-sitter-slint = { version = "0.24", optional = true }
tree-sitter-solidity = { version = "1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-v = { version = "0.0", optional = true }
tree-sitter-verilog = { version = "1", optional = true }
tree-sitter-vhdl = { version = "1", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-zig = { version = "1", optional = true }
tree-sitter-zsh = { version = "0.63", optional = true }

# Newly verified compatible with tree-sitter 0.26:
tree-sitter-asm = { version = "0.24", optional = true }
tree-sitter-commonlisp = { version = "0.4", optional = true }
tree-sitter-cmake = { version = "0.7", optional = true }
tree-sitter-dafny = { version = "0.1", optional = true }
tree-sitter-elisp = { version = "1.7", optional = true }
tree-sitter-hare = { version = "0.20", optional = true }
tree-sitter-markdown = { version = "0.7", optional = true }
tree-sitter-nickel = { version = "0.5", optional = true }
tree-sitter-prisma = { version = "0.1", optional = true }
tree-sitter-rst = { version = "0.2", optional = true }
tree-sitter-sas = { version = "0.3", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-toml = { version = "0.20", optional = true }
tree-sitter-vue = { version = "0.0", optional = true }
tree-sitter-wgsl = { version = "0.0", optional = true }
tree-sitter-asciidoc = { version = "0.9", optional = true }

# Blocked crates (incompatible tree-sitter versions):
# kotlin (needs >=0.21, <0.23), lean4 (needs ^0.25),
# clojure (needs ^0.25.6, links conflict),
# dockerfile (pulls v0.20.10), sql (pulls v0.19.5),
# tlaplus (pulls v0.19.5, Language type mismatch)

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[profile.release]
# Reduce binary size. strip=debuginfo is cargo 1.94's default already, but
# keeping it explicit documents intent. opt-level="s" favours code size;
# fat LTO + single codegen unit maximise cross-crate dead-code elimination.
strip = "debuginfo"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
